<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Visual cdecl</title>
    <meta name="description" content="Edit a C declaration as English, as C code, or as an interactive diagram of boxes and arrows. All three stay in sync in real time." />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%234f6df5'/%3E%3Ccircle cx='10' cy='16' r='3.5' fill='white'/%3E%3Cpath d='M13 16h9m-3-3.5 3.5 3.5-3.5 3.5' stroke='white' stroke-width='2.2' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />
    <script>
      try {
        const t = localStorage.getItem('theme');
        if (t) document.documentElement.dataset.theme = t;
      } catch {}
    </script>
  </head>
  <body>
    <header class="top">
      <div class="brand">
        <h1>Visual <span>cdecl</span></h1>
        <p>Type in any pane &mdash; the other two follow.</p>
      </div>
      <div class="controls">
        <label class="sr-only" for="examples">Examples</label>
        <select id="examples"></select>
        <button id="theme" class="btn" type="button" aria-label="Toggle light/dark theme" title="Toggle theme">◐</button>
        <a class="btn" href="https://github.com/avestura/visual-cdecl" target="_blank" rel="noopener">GitHub</a>
      </div>
    </header>

    <main>
      <section class="panel" aria-labelledby="h-en">
        <div class="panel-head">
          <h2 id="h-en">English</h2>
          <button class="btn small" data-copy="english" type="button">Copy</button>
        </div>
        <textarea id="english" rows="3" spellcheck="false" autocapitalize="off" autocomplete="off"></textarea>
        <p class="msg" id="english-msg" role="status"></p>
      </section>

      <section class="panel" aria-labelledby="h-c">
        <div class="panel-head">
          <h2 id="h-c">C</h2>
          <button class="btn small" data-copy="c" type="button">Copy</button>
        </div>
        <textarea id="c" rows="3" spellcheck="false" autocapitalize="off" autocomplete="off"></textarea>
        <p class="msg" id="c-msg" role="status"></p>
      </section>

      <section class="panel visual" aria-labelledby="h-vis">
        <div class="panel-head">
          <h2 id="h-vis">Visual</h2>
          <span class="hint">Click a box to select it, then use the editor below.</span>
        </div>
        <div id="diagram" class="diagram"></div>
        <div id="editor" class="editor"></div>
      </section>
    </main>

    <footer>
      Inspired by <a href="https://cdecl.org" target="_blank" rel="noopener">cdecl.org</a> &middot; MIT licensed
    </footer>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
