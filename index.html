<!doctype html>
<html lang="en" data-mode="blueprint" data-density="compact">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Visual cdecl</title>
    <meta name="description" content="Edit a C declaration as English, as C code, or as an interactive diagram of boxes and arrows. All three stay in sync in real time." />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%230f62fe'/%3E%3Crect x='6' y='13' width='6' height='6' fill='white'/%3E%3Cpath d='M14 16h10m-4-4 4 4-4 4' stroke='white' stroke-width='2.5' fill='none'/%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@500;600&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
    <script>
      try {
        const t = localStorage.getItem('theme');
        if (t) document.documentElement.dataset.theme = t;
      } catch {}
    </script>
  </head>
  <body>
    <header class="site-bar">
      <div class="bx-container bar-inner">
        <span class="bx-label brand">VISUAL&nbsp;CDECL</span>
        <div class="bx-cluster" style="--bx-gap: var(--bx-space-2)">
          <label class="bx-sr" for="examples">Examples</label>
          <select id="examples" class="bx-select"></select>
          <button id="theme" class="bx-btn bx-btn--icon" type="button" aria-label="Toggle light/dark theme" title="Toggle theme">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="square" aria-hidden="true"><rect x="2.75" y="2.75" width="10.5" height="10.5"/><path d="M8 2.75v10.5" /><path d="M8 2.75h5.25v10.5H8z" fill="currentColor"/></svg>
          </button>
          <a class="bx-btn" href="https://github.com/avestura/visual-cdecl" target="_blank" rel="noopener">GitHub</a>
        </div>
      </div>
    </header>

    <section class="hero bx-grid-bg">
      <div class="bx-container hero-inner bx-ticks">
        <p class="bx-label">01 / Translator</p>
        <h1>Read any C declaration, three ways.</h1>
        <p class="lede">Type in English, type in C, or edit the diagram. The other two follow as you type.</p>
      </div>
    </section>

    <main class="bx-container rail">
      <div class="bx-collapse panes">
        <section class="pane" aria-labelledby="h-en">
          <div class="pane-head">
            <h2 id="h-en" class="bx-label">02 / English</h2>
            <button class="bx-btn bx-btn--sm bx-btn--ghost" data-copy="english" type="button">Copy</button>
          </div>
          <textarea id="english" class="bx-textarea mono" rows="3" spellcheck="false" autocapitalize="off" autocomplete="off"></textarea>
          <p class="msg" id="english-msg" role="status"></p>
        </section>

        <section class="pane" aria-labelledby="h-c">
          <div class="pane-head">
            <h2 id="h-c" class="bx-label">03 / C</h2>
            <button class="bx-btn bx-btn--sm bx-btn--ghost" data-copy="c" type="button">Copy</button>
          </div>
          <textarea id="c" class="bx-textarea mono" rows="3" spellcheck="false" autocapitalize="off" autocomplete="off"></textarea>
          <p class="msg" id="c-msg" role="status"></p>
        </section>

        <section class="pane pane-wide" aria-labelledby="h-vis">
          <div class="pane-head">
            <h2 id="h-vis" class="bx-label">04 / Visual</h2>
            <span class="bx-label faint">Select a box &rarr; edit below</span>
          </div>
          <div id="diagram" class="diagram bx-dot-bg"></div>
          <div id="editor" class="editor"></div>
        </section>
      </div>
    </main>

    <footer class="bx-container foot">
      <span class="bx-label">Inspired by <a href="https://cdecl.org" target="_blank" rel="noopener">cdecl.org</a></span>
      <span class="bx-label">MIT &middot; <a href="https://github.com/avestura/visual-cdecl" target="_blank" rel="noopener">source</a></span>
    </footer>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
